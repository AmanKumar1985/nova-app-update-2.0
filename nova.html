function initReelsObserver(){
  const vids = document.querySelectorAll('.reel-video');
  if(!vids.length) return;
  
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const vid = entry.target;
      if(entry.isIntersecting){
        vid.play().catch(()=>{});
      } else {
        vid.pause();
      }
    });
  }, { threshold: 0.6 });

  vids.forEach(v => {
    observer.observe(v);
    v.onclick = () => {
      v.muted = !v.muted;
      toast(v.muted ? '🔇 Muted' : '🔊 Sound On');
    };
  });
}

function togglePlayMp3(songId){
  const song = MUSIC_DATABASE.find(s=>s.id===songId);
  if(!song) return;

  if(currentPlayingSongId === songId){
    if(globalAudio){ globalAudio.pause(); globalAudio = null; }
    currentPlayingSongId = null;
    toast('⏸ Music Stopped');
  } else {
    if(globalAudio){ globalAudio.pause(); }
    globalAudio = new Audio(song.mp3);
    globalAudio.play().catch(()=>{});
    currentPlayingSongId = songId;
    toast(`▶ Playing: ${song.title}`);
  }
  render();
}

function formatBytes(bytes){if(!bytes)return'';let k=1024,sizes=['B','KB','MB','GB'];let i=Math.floor(Math.log(bytes)/Math.log(k));return parseFloat((bytes/Math.pow(k,i)).toFixed(1))+' '+sizes[i]}

function messageBubble(m){
  const meBubble=m.from==='me';
  const ticks=meBubble?`<span class="ticks ${m.readAt?'seen':''}">${m.readAt?'✓✓':'✓'}</span>`:'';
  const imgTag = m.image ? `<img src="${m.image}" class="msg-img-preview">` : '';
  const audioTag = m.audio ? `<div style="display:flex;align-items:center;gap:6px;margin:4px 0"><span style="font-size:16px">🎙️</span><audio controls src="${m.audio}" style="height:32px;max-width:210px"></audio></div>` : '';
  let fileTag = '';
  if(m.file){
    if(m.file.isAudio){
      fileTag = `<div style="background:rgba(0,0,0,0.25);padding:8px 12px;border-radius:12px;margin:4px 0"><div style="font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px">🎵 ${esc(m.file.name)}</div><div class="small muted">${formatBytes(m.file.size)}</div><audio controls src="${m.file.data}" style="width:100%;height:34px;margin-top:6px"></audio></div>`;
    } else {
      fileTag = `<div style="background:rgba(0,0,0,0.25);padding:8px 12px;border-radius:12px;margin:4px 0"><div style="font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px">📄 ${esc(m.file.name)}</div><div class="small muted">${formatBytes(m.file.size)}</div><a href="${m.file.data}" download="${esc(m.file.name)}" class="pill secondary small" style="display:inline-block;margin-top:6px;text-decoration:none">📥 Download File</a></div>`;
    }
  }
  return `<div class="bubble ${meBubble?'me':''}" data-msg-id="${m.id}" data-from="${m.from}">${m.pinned?'<div class="pinlabel">📌 Pinned</div>':''}${m.forwarded?'<div class="small" style="opacity:.6;font-style:italic">Forwarded</div>':''}${m.replyTo?`<div class="replyquote">${esc(m.replyTo.text||'Message unsent')}</div>`:''}${m.deleted?'<div class="small" style="font-style:italic;opacity:.7">Message unsent</div>':imgTag + audioTag + fileTag + (m.text?`<div>${esc(m.text)}</div>`:'')}<div class="small" style="opacity:.75">${fullTime(m.createdAt)}${ticks}</div>${m.reactions&&m.reactions.length?`<div class="reactrow">${m.reactions.map(r=>r.emoji+(r.count>1?r.count:'')).join(' ')}</div>`:''}</div>`;
}

async function sendMessage(e){
  e.preventDefault();if(!partner)return;
  let input=document.querySelector('#message');let btn=document.querySelector('#sendbtn');
  let text=input.value.trim();if((!text && !dmImage)||sending)return;
  sending=true;btn.disabled=true;
  let box=document.querySelector('#messages');let empty=box.querySelector('.empty');if(empty)empty.remove();
  const replyId=replyTarget?replyTarget.id:null;
  const replyHtml=replyTarget?`<div class="replyquote">${esc(replyTarget.deleted?'Message unsent':(replyTarget.text||''))}</div>`:'';
  box.insertAdjacentHTML('beforeend',`<div class="bubble me">${replyHtml}${dmImage?`<img src="${dmImage}" class="msg-img-preview">`:''}${esc(text)}<div class="small" style="opacity:.75">अभी</div></div>`);
  box.scrollTop=box.scrollHeight;
  const sentImg = dmImage;
  input.value='';dmImage=null;
  try{
    await api('/api/messages/'+partner.username,{method:'POST',body:JSON.stringify({text,image:sentImg,replyTo:replyId})});
    replyTarget=null;render();

}

function connectWS(){
  if(!token) return;
  if(ws){try{ws.onclose=null;ws.close()}catch(e){}}
  const proto=location.protocol==='https:'?'wss:':'ws:';
  ws=new WebSocket(proto+'//'+location.host+'/ws?token='+encodeURIComponent(token));
  ws.onopen=()=>{wsReady=true};
  ws.onclose=()=>{wsReady=false;if(me)setTimeout(connectWS,2000)};
  ws.onerror=()=>{};
  ws.onmessage=evt=>{let data;try{data=JSON.parse(evt.data)}catch(e){return}handleWS(data)};
}
function wsSendMsg(obj){if(ws&&wsReady)try{ws.send(JSON.stringify(obj))}catch(e){}}

function handleWS(data){
  if(data.type==='message'){
    if(data.message.from==='them'){
      unreadCounts.messages++;
      renderTop();
      if(screen==='thread'&&partner&&partner.username===data.message.with)render();
      else{toast('New message from '+data.message.with);if(screen==='messages')loadMessagesInbox()}
    }
  } else if(data.type==='typing'){
    if(screen==='thread'&&partner&&partner.username===data.from){
      let el=document.querySelector('#typing-indicator');if(el)el.textContent='typing...';
      if(typingHideId)clearTimeout(typingHideId);
      typingHideId=setTimeout(()=>{let e2=document.querySelector('#typing-indicator');if(e2)e2.textContent=''},2500);
    }
  } else if(data.type==='read'){
    if(screen==='thread'&&partner&&partner.username===data.from)render();
  } else if(data.type==='reaction'||data.type==='unsend'||data.type==='pin'){
    if(screen==='thread')render();
    if(screen==='messages')loadMessagesInbox();
  } else if(data.type&&data.type.startsWith('call:')){
    handleCallSignal(data);
  }
}

let mediaRecorder = null, audioChunks = [], isRecording = false, recordIntervalId = null, recordSeconds = 0;

async function startAudioRecording(){
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => { if(e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.start();
    isRecording = true;
    recordSeconds = 0;
    
    const sendForm = document.querySelector('#sendform');
    const recBar = document.querySelector('#recording-bar');
    if(sendForm && recBar){
      sendForm.classList.add('hidden');
      recBar.classList.remove('hidden');
    }
    
    const txt = document.querySelector('#record-timer-txt');
    recordIntervalId = setInterval(() => {
      recordSeconds++;
      if(txt){
        const m = String(Math.floor(recordSeconds/60)).padStart(2,'0');
        const s = String(recordSeconds%60).padStart(2,'0');
        txt.textContent = `${m}:${s}`;
      }
    }, 1000);
  } catch(e) {
    toast('Microphone permission chahiye voice note ke liye');
  }
}

function cancelAudioRecording(){
  if(mediaRecorder && isRecording){
    mediaRecorder.onstop = null;
    mediaRecorder.stop();
    if(mediaRecorder.stream) mediaRecorder.stream.getTracks().forEach(t=>t.stop());
  }
  cleanupAudioRecording();
}

function cleanupAudioRecording(){
  isRecording = false;
  if(recordIntervalId){ clearInterval(recordIntervalId); recordIntervalId = null; }
  recordSeconds = 0;
  const sendForm = document.querySelector('#sendform');
  const recBar = document.querySelector('#recording-bar');
  if(sendForm && recBar){
    sendForm.classList.remove('hidden');
    recBar.classList.add('hidden');
  }
}

function stopAndSendAudioRecording(){
  if(!mediaRecorder || !isRecording) return;
  mediaRecorder.onstop = async () => {
    const blob = new Blob(audioChunks, { type: audioChunks[0]?.type || 'audio/webm' });
    if(mediaRecorder.stream) mediaRecorder.stream.getTracks().forEach(t=>t.stop());
    cleanupAudioRecording();
    
    if(blob.size < 100) return toast('Voice note short tha');
    const reader = new FileReader();
    reader.onload = async () => {
      const audioBase64 = reader.result;
      if(!partner) return;
      try {
        let box = document.querySelector('#messages');
        let empty = box ? box.querySelector('.empty') : null;
        if(empty) empty.remove();
        if(box){
          box.insertAdjacentHTML('beforeend', `<div class="bubble me"><div style="display:flex;align-items:center;gap:6px;margin:4px 0"><span style="font-size:16px">🎙️</span><audio controls src="${audioBase64}" style="height:32px;max-width:210px"></audio></div><div class="small" style="opacity:.75">अभी</div></div>`);
          box.scrollTop = box.scrollHeight;
        }
        await api('/api/messages/'+partner.username, { method:'POST', body: JSON.stringify({ audio: audioBase64 }) });
        render();
      } catch(x){ toast(x.message); }
    };
    reader.readAsDataURL(blob);
  };
  mediaRecorder.stop();
}

let isVideoCall = false;
let micMuted = false, cameraOff = false;

function setupPeerConnection(targetUsername){
  pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
  if(localStream){
    localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
  }
  pc.onicecandidate=e=>{if(e.candidate)wsSendMsg({type:'call:ice',to:targetUsername,candidate:e.candidate})};
  pc.ontrack=e=>{
    let rv = document.querySelector('#remoteVideo');
    if(rv) rv.srcObject = e.streams[0];
    let ra = document.querySelector('#remoteAudio');
    if(!ra){
      ra = document.createElement('audio');
      ra.id = 'remoteAudio';
      ra.autoplay = true;
      document.body.appendChild(ra);
    }
    ra.srcObject = e.streams[0];
  };
  pc.onconnectionstatechange=()=>{
    if(!pc)return;
    if(pc.connectionState==='connected'&&callState!=='active'){
      callState='active';callStartTs=Date.now();callTimerId=setInterval(updateCallTimer,1000);renderCallOverlay();
    } else if(['failed','disconnected','closed'].includes(pc.connectionState)){
      if(callState)endCall(false);
    }
  };
}

async function startCall(username, video = false){
  if(callState)return toast('Ek call already chal rahi hai');
  isVideoCall = video;
  micMuted = false; cameraOff = false;
  try{
    localStream=await navigator.mediaDevices.getUserMedia({
      audio:true,
      video: isVideoCall ? { width:{ideal:1280}, height:{ideal:720}, facingMode:'user' } : false
    });
  }catch(e){
    return toast(isVideoCall ? 'Camera & Microphone permission chahiye' : 'Microphone permission chahiye');
  }
  callPartnerUser=partner;callState='calling';renderCallOverlay();
  setupPeerConnection(username);
  const offer=await pc.createOffer();await pc.setLocalDescription(offer);
  wsSendMsg({type:'call:offer',to:username,sdp:offer,isVideo:isVideoCall});
}

async function acceptCall(){
  if(!incomingCall)return;
  isVideoCall = !!incomingCall.isVideo;
  micMuted = false; cameraOff = false;
  try{
    localStream=await navigator.mediaDevices.getUserMedia({
      audio:true,
      video: isVideoCall ? { width:{ideal:1280}, height:{ideal:720}, facingMode:'user' } : false
    });
  }catch(e){
    toast(isVideoCall ? 'Camera & Mic permission chahiye' : 'Microphone permission chahiye');
    declineCall();
    return;
  }
  setupPeerConnection(incomingCall.from);
  await pc.setRemoteDescription(new RTCSessionDescription(incomingCall.sdp));
  const answer=await pc.createAnswer();await pc.setLocalDescription(answer);
  wsSendMsg({type:'call:answer',to:incomingCall.from,sdp:answer});
  callPartnerUser={username:incomingCall.from,displayName:incomingCall.fromName||incomingCall.from,avatar:incomingCall.fromAvatar};
  callState='active';callStartTs=Date.now();callTimerId=setInterval(updateCallTimer,1000);incomingCall=null;renderCallOverlay();
}

function toggleMic(){
  if(!localStream) return;
  const audioTrack = localStream.getAudioTracks()[0];
  if(audioTrack){
    audioTrack.enabled = !audioTrack.enabled;
    micMuted = !audioTrack.enabled;
    const btn = document.querySelector('#toggle-mic-btn');
    if(btn) btn.textContent = micMuted ? '🔇 Unmute' : '🎤 Mute';
  }
}

function toggleCamera(){
  if(!localStream || !isVideoCall) return;
  const videoTrack = localStream.getVideoTracks()[0];
  if(videoTrack){
    videoTrack.enabled = !videoTrack.enabled;
    cameraOff = !videoTrack.enabled;
    const btn = document.querySelector('#toggle-cam-btn');
    if(btn) btn.textContent = cameraOff ? '📷 Cam On' : '📷 Cam Off';
  }
}

function declineCall(){if(incomingCall)wsSendMsg({type:'call:reject',to:incomingCall.from});cleanupCall()}
function endCall(notify=true){if(notify&&callPartnerUser)wsSendMsg({type:'call:end',to:callPartnerUser.username});cleanupCall()}

function cleanupCall(){
  if(callTimerId){clearInterval(callTimerId);callTimerId=null}
  if(pc){try{pc.close()}catch(e){}pc=null}
  if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null}
  callState=null;incomingCall=null;callPartnerUser=null;isVideoCall=false;
  const el=document.querySelector('#calloverlay');if(el)el.remove();
  const a=document.querySelector('#remoteAudio');if(a)a.remove();
}

function updateCallTimer(){const el=document.querySelector('#call-timer');if(el){const s=Math.floor((Date.now()-callStartTs)/1000);el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}}

async function handleCallSignal(data){
  if(data.type==='call:offer'){
    if(callState){wsSendMsg({type:'call:reject',to:data.from});return}
    incomingCall={from:data.from,fromName:data.fromName,fromAvatar:data.fromAvatar,sdp:data.sdp,isVideo:!!data.isVideo};
    callState='ringing';renderCallOverlay();
  } else if(data.type==='call:answer'){
    if(pc)await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
  } else if(data.type==='call:ice'){
    if(pc)try{await pc.addIceCandidate(new RTCIceCandidate(data.candidate))}catch(e){}
  } else if(data.type==='call:end'){
    toast('Call khatam ho gaya');cleanupCall();
  } else if(data.type==='call:reject'){
    toast('Call decline kar diya');cleanupCall();
  }
}

function renderCallOverlay(){
  let el=document.querySelector('#calloverlay');if(el)el.remove();
  if(!callState)return;
  const person=callState==='ringing'?{displayName:incomingCall.fromName||incomingCall.from,avatar:incomingCall.fromAvatar}:(callPartnerUser||{});
  const callTypeLabel = isVideoCall ? 'Video Call' : 'Audio Call';
  const status=callState==='calling'?`Calling (${callTypeLabel})...`:callState==='ringing'?`Incoming ${callTypeLabel}`:'<span id="call-timer">00:00</span>';
  
  let mediaElements = '';
  if(isVideoCall && callState==='active'){
    mediaElements = `
      <video id="remoteVideo" autoplay playsinline style="width:100%;height:100%;object-fit:cover;position:absolute;inset:0;background:#000"></video>
      <video id="localVideo" autoplay playsinline muted style="position:absolute;top:20px;right:20px;width:100px;height:140px;border-radius:12px;object-fit:cover;border:2px solid #ffffff60;z-index:10;background:#111"></video>
    `;
  }

  const controls = `
    ${isVideoCall ? `<button class="pill secondary" id="toggle-cam-btn">${cameraOff?'📷 Cam On':'📷 Cam Off'}</button>` : ''}
    <button class="pill secondary" id="toggle-mic-btn">${micMuted?'🔇 Unmute':'🎤 Mute'}</button>
    <button class="pill danger" id="end-call">End call</button>
  `;

  const html=`<div id="calloverlay" class="calloverlay" style="${isVideoCall&&callState==='active'?'padding:0':''}">
    ${mediaElements}
    <div class="callcard" style="${isVideoCall&&callState==='active'?'position:absolute;bottom:30px;z-index:20;background:#000000a0;padding:16px 24px;border-radius:20px;backdrop-filter:blur(10px)':''}">
      ${(isVideoCall&&callState==='active')?'':avatar(person,'big')}
      <h3>${esc(person.displayName||'')}</h3>
      <p class="muted">${status}</p>
      <div class="callactions">
        ${callState==='ringing'?'<button class="pill danger" id="decline-call">Decline</button><button class="pill primary" id="accept-call">Accept</button>':controls}
      </div>
    </div>
  </div>`;
  
  document.body.insertAdjacentHTML('beforeend',html);
  
  if(isVideoCall && callState==='active' && localStream){
    const lv = document.querySelector('#localVideo');
    if(lv) lv.srcObject = localStream;
  }

  const dec=document.querySelector('#decline-call');if(dec)dec.onclick=declineCall;
  const acc=document.querySelector('#accept-call');if(acc)acc.onclick=acceptCall;
  const end=document.querySelector('#end-call');if(end)end.onclick=()=>endCall(true);
  const micBtn=document.querySelector('#toggle-mic-btn');if(micBtn)micBtn.onclick=toggleMic;
  const camBtn=document.querySelector('#toggle-cam-btn');if(camBtn)camBtn.onclick=toggleCamera;
}

function closeActionSheet(){actionSheetMsg=null;const el=document.querySelector('#actionsheet');if(el)el.remove()}
function openActionSheet(msgId,from){actionSheetMsg=threadMessages.find(m=>m.id===msgId);if(!actionSheetMsg)return;renderActionSheet()}
function renderActionSheet(){
  const m=actionSheetMsg;if(!m)return;
  const html=`<div id="actionsheet" class="sheet-overlay"><div class="sheet">
    <div class="reactbar">${['❤️','😂','😮','😢','😡','👍'].map(e=>`<button data-react="${e}">${e}</button>`).join('')}</div>
    <button data-act="reply">↩ Reply</button>
    <button data-act="forward">➤ Forward</button>
    ${m.deleted?'':'<button data-act="copy">⧉ Copy</button>'}
    <button data-act="pin">📌 ${m.pinned?'Unpin':'Pin'}</button>
    ${m.from==='me'&&!m.deleted?'<button data-act="unsend" class="danger">🗑 Unsend</button>':''}
    <button data-act="close">Cancel</button>
  </div></div>`;
  document.body.insertAdjacentHTML('beforeend',html);
  const overlay=document.querySelector('#actionsheet');overlay.onclick=e=>{if(e.target.id==='actionsheet')closeActionSheet()};
  overlay.querySelectorAll('[data-react]').forEach(b=>b.onclick=()=>{reactToMessage(m.id,b.dataset.react);closeActionSheet()});
  overlay.querySelector('[data-act="reply"]').onclick=()=>{replyTarget=m;closeActionSheet();render()};
  overlay.querySelector('[data-act="forward"]').onclick=()=>{closeActionSheet();openForwardPicker(m)};
  const copyBtn=overlay.querySelector('[data-act="copy"]');if(copyBtn)copyBtn.onclick=()=>{navigator.clipboard.writeText(m.text||'').catch(()=>{});closeActionSheet();toast('Copied')};
  overlay.querySelector('[data-act="pin"]').onclick=async()=>{closeActionSheet();try{await api('/api/messages/'+m.id+'/pin',{method:'POST'});render()}catch(e){toast(e.message)}};
  const unsendBtn=overlay.querySelector('[data-act="unsend"]');if(unsendBtn)unsendBtn.onclick=async()=>{closeActionSheet();try{await api('/api/messages/'+m.id,{method:'DELETE'});render()}catch(e){toast(e.message)}};
  overlay.querySelector('[data-act="close"]').onclick=closeActionSheet;
}
async function reactToMessage(msgId,emoji){try{await api('/api/messages/'+msgId+'/react',{method:'POST',body:JSON.stringify({emoji})});render()}catch(e){toast(e.message)}}

function closeForward(){forwardMsg=null;const el=document.querySelector('#forwardsheet');if(el)el.remove()}
function openForwardPicker(m){
  forwardMsg=m;
  const html=`<div id="forwardsheet" class="sheet-overlay"><div class="sheet"><h3>Forward to</h3><div class="fwdlist">${conversations.length?conversations.map(c=>`<button class="user" data-fwd="${esc(c.partner.username)}">${avatar(c.partner)}<div class="grow">${esc(c.partner.displayName)}</div></button>`).join(''):'<div class="empty">Koi conversation nahi mila.</div>'}</div><button data-act="close">Cancel</button></div></div>`;
  document.body.insertAdjacentHTML('beforeend',html);
  const overlay=document.querySelector('#forwardsheet');overlay.onclick=e=>{if(e.target.id==='forwardsheet')closeForward()};
  overlay.querySelectorAll('[data-fwd]').forEach(b=>b.onclick=async()=>{try{await api('/api/messages/'+b.dataset.fwd,{method:'POST',body:JSON.stringify({text:forwardMsg.text,forwarded:true})});toast('Forward ho gaya');closeForward()}catch(e){toast(e.message)}});
  overlay.querySelector('[data-act="close"]').onclick=closeForward;
}

function closeCreateSheetFn(){createSheetOpen=false;const el=document.querySelector('#createsheet');if(el)el.remove()}
function openCreateSheet(){createSheetOpen=true;const html=`<div id="createsheet" class="sheet-overlay"><div class="sheet"><h3 style="text-align:center;margin:4px 0 10px">Create</h3><button data-create-opt="reel">🎬 Reel</button><button data-create-opt="post">▦ Post</button><button data-create-opt="story">◎ Story</button><button data-create-opt="highlight">♡ Highlights</button><button data-act="close">Cancel</button></div></div>`;document.body.insertAdjacentHTML('beforeend',html);const overlay=document.querySelector('#createsheet');overlay.onclick=e=>{if(e.target.id==='createsheet')closeCreateSheetFn()};overlay.querySelectorAll('[data-create-opt]').forEach(b=>b.onclick=()=>{const opt=b.dataset.createOpt;closeCreateSheetFn();if(opt==='highlight'){openHighlightPicker()}else{addMode=opt;uploadImage=null;uploadIsVideo=false;screen='add';render()}});overlay.querySelector('[data-act="close"]').onclick=closeCreateSheetFn}

/* Story Viewer & Story Views Modal */
function closeStoryViewer(){if(storyTimerId){clearInterval(storyTimerId);storyTimerId=null}storyViewer=null;const el=document.querySelector('#storyviewer');if(el)el.remove()}
function svAdvance(dir){if(!storyViewer)return;storyViewer.index+=dir;if(storyViewer.index<0||storyViewer.index>=storyViewer.items.length){closeStoryViewer();return}renderStoryViewer()}
function openStoryViewer(items,index,title){storyViewer={items,index,title};renderStoryViewer()}

async function renderStoryViewer(){
  let el=document.querySelector('#storyviewer');if(el)el.remove();
  if(storyTimerId){clearInterval(storyTimerId);storyTimerId=null}
  if(!storyViewer)return;
  
  const {items,index,title}=storyViewer;
  const currentStory = items[index];
  
  /* Record Story View */
  if(currentStory&&currentStory.id){
    api('/api/stories/'+currentStory.id+'/view', {method:'POST'}).catch(()=>{});
  }

  const isMyStory = currentStory && currentStory.author && me && currentStory.author.username === me.username;
  const viewersBtn = isMyStory ? `<button id="sv-viewers-btn" style="position:absolute;bottom:15px;left:15px;background:#0008;color:#fff;border:0;padding:6px 14px;border-radius:20px;z-index:10;font-weight:700">👁️ Viewers</button>` : '';

  const bars=items.map((_,i)=>`<div class="sv-bar ${i<index?'done':''}"><i id="sv-fill-${i}"></i></div>`).join('');
  const html=`<div id="storyviewer" class="storyviewer"><div class="sv-bars">${bars}</div><div class="sv-head">${avatar({displayName:title})}<b>${esc(title||'')}</b><button class="sv-close" id="sv-close">✕</button></div><div class="sv-body"><img src="${currentStory.image}" alt=""><div class="sv-tap" style="left:0" id="sv-prev"></div><div class="sv-tap" style="right:0" id="sv-next"></div>${viewersBtn}</div></div>`;
  
  document.body.insertAdjacentHTML('beforeend',html);
  document.querySelector('#sv-close').onclick=closeStoryViewer;
  document.querySelector('#sv-prev').onclick=()=>svAdvance(-1);
  document.querySelector('#sv-next').onclick=()=>svAdvance(1);
  
  const vBtn = document.querySelector('#sv-viewers-btn');
  if(vBtn){
    vBtn.onclick = async (e) => {
      e.stopPropagation();
      try {
        const data = await api('/api/stories/'+currentStory.id+'/views');
        openStoryViewersModal(data.views);
      } catch(x){toast(x.message)}
    };
  }

  const fill=document.querySelector('#sv-fill-'+index);
  if(fill){
    let pct=0;
    storyTimerId=setInterval(()=>{
      pct+=2;
      fill.style.width=pct+'%';
      if(pct>=100)svAdvance(1);
    },100);
  }
}

function openStoryViewersModal(views){
  let el=document.querySelector('#svviewsmodal');if(el)el.remove();
  const html = `<div id="svviewsmodal" class="sheet-overlay" style="z-index:60"><div class="sheet">
    <h3 style="margin:0 0 10px;text-align:center">Story Viewers (${views.length})</h3>
    <div style="max-height:50vh;overflow-y:auto">
      ${views.length ? views.map(v => `
        <div class="viewer-row">
          ${avatar(v)}
          <div class="grow">
            <b>${esc(v.displayName)}</b>
            <div class="muted small">@${esc(v.username)} · ${ago(v.viewedAt)}</div>
          </div>
        </div>
      `).join('') : '<div class="empty">No viewers yet</div>'}
    </div>
    <button data-act="close" style="margin-top:10px;text-align:center">Close</button>
  </div></div>`;
  document.body.insertAdjacentHTML('beforeend', html);
  const modal = document.querySelector('#svviewsmodal');
  modal.onclick = e => { if(e.target.id==='svviewsmodal') modal.remove(); };
  modal.querySelector('[data-act="close"]').onclick = () => modal.remove();
}

async function viewHighlight(hid){try{const data=await api('/api/highlights/'+hid);if(!data.items.length)return toast('Yeh highlight khali hai');openStoryViewer(data.items,0,data.highlight.title)}catch(e){toast(e.message)}}

function closeHighlightPicker(){highlightPicker=null;highlightPickerSelected=[];const el=document.querySelector('#hpsheet');if(el)el.remove()}
async function openHighlightPicker(){try{const data=await api('/api/stories?mine=1');highlightPicker={stories:data.stories};highlightPickerSelected=[];renderHighlightPicker()}catch(e){toast(e.message)}}
function renderHighlightPicker(){let el=document.querySelector('#hpsheet');if(el)el.remove();if(!highlightPicker)return;const {stories}=highlightPicker;const html=`<div id="hpsheet" class="sheet-overlay"><div class="sheet"><h3>New Highlight</h3>${stories.length?`<div class="hp-grid">${stories.map(s=>`<div class="hp-item ${highlightPickerSelected.includes(s.id)?'picked':''}" data-hp="${s.id}"><img src="${s.image}" alt=""><div class="hp-check">${highlightPickerSelected.includes(s.id)?'✓':''}</div></div>`).join('')}</div><label>Title</label><input id="hp-title" maxlength="30" placeholder="Highlight name"><button class="primary" id="hp-create">Create Highlight</button>`:'<div class="empty">Aapki koi active story nahi hai.<br>Pehle ek story post karo.</div>'}<button data-act="close">Cancel</button></div></div>`;document.body.insertAdjacentHTML('beforeend',html);const overlay=document.querySelector('#hpsheet');overlay.onclick=e=>{if(e.target.id==='hpsheet')closeHighlightPicker()};overlay.querySelectorAll('[data-hp]').forEach(b=>b.onclick=()=>{const sid=b.dataset.hp;const i=highlightPickerSelected.indexOf(sid);if(i===-1)highlightPickerSelected.push(sid);else highlightPickerSelected.splice(i,1);renderHighlightPicker()});const createBtn=overlay.querySelector('#hp-create');if(createBtn)createBtn.onclick=async()=>{const title=document.querySelector('#hp-title').value.trim()||'Highlight';if(!highlightPickerSelected.length)return toast('Kam se kam ek story select karo');try{await api('/api/highlights',{method:'POST',body:JSON.stringify({title,storyIds:highlightPickerSelected})});closeHighlightPicker();toast('Highlight ban gaya!');if(profile)await openProfile(profile.username);else render()}catch(e){toast(e.message)}};const closeBtn=overlay.querySelector('[data-act="close"]');if(closeBtn)closeBtn.onclick=closeHighlightPicker}

boot();

if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
</script></body></html>
